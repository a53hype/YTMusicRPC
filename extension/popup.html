<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>YouTube Music Discord RPC</title>
  <style>
    body{width:270px;margin:0;padding:17px;background:#111318;color:#eef0f5;font:13px "Segoe UI",sans-serif}
    h1{font-size:15px;margin:0 0 7px}
    p{color:#aab1bf;line-height:1.5;margin:7px 0 13px}
    button{border:0;border-radius:7px;background:#5865f2;color:white;padding:9px 12px;font-weight:600;cursor:pointer}
    .muted{font-size:11px;color:#7f8795}
  </style>
</head>
<body>
  <h1>YouTube Music → Discord</h1>
  <p>Play a song on <b>music.youtube.com</b>. The desktop companion will publish the track, live progress, artwork and Listen button.</p>
  <button id="open">Open YouTube Music</button>
  <p class="muted">Playback data is sent only to the local app on this PC.</p>
  <script src="popup.js"></script>
</body>
</html>
